# CI: run the offline test suite on every push and pull request.
#
# This is the automated version of "clone the repo on a fresh machine and
# run pytest" — the check that would have caught the phantom fredapi>=3.1
# pin (a version that never existed on PyPI) the day it was written,
# instead of weeks later during dockerization. The suite needs no API key
# and no data: every network call is mocked.

name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (the fresh-clone experience)
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q
