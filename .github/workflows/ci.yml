# CI — the release gates, run on every push and pull request.
#
# This is the automated version of "clone the repo on a fresh machine and check
# it". It caught the phantom `fredapi>=3.1` pin (a version that never existed
# on PyPI) and it is where the Phase 3 gates live.
#
# WHAT CI CAN AND CANNOT CHECK. `data/` is DVC-managed and licence-restricted,
# so it is not in Git. Most jobs therefore check only what needs no market
# data: the test suite, the smoke pipeline on synthetic data, the API, and the
# image.
#
# The `release-gates` job is the exception. It pulls the bundle from the
# private R2 remote using a READ-ONLY, single-bucket token, and runs the three
# gates that genuinely need data — snapshot verification, the artifact
# preflight, and whether the model cards still match their artifacts. It never
# runs on `pull_request`: this repository is public, and market data from
# sources that prohibit redistribution must not be reachable from an untrusted
# trigger. See docs/DATA_GOVERNANCE.md §2.
#
# The data-dependent steps in `runtime` degrade to a notice rather than
# duplicating that job; keeping them there documents the dependency at the
# point where a reader would otherwise assume it was checked.

name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"   # matches requirements.lock.txt and the snapshot manifest

jobs:
  tests:
    name: test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # The RANGE file, deliberately: this job is the fresh-clone experience,
      # and it is what would catch an unsatisfiable or withdrawn dependency.
      # The `runtime` job below installs the lock instead.
      - name: Install dependencies (fresh-clone experience)
        run: pip install -r requirements.txt

      - name: Full test suite
        run: python -m pytest tests/ -q

      # Redundant with the line above, and intentionally so: these are the
      # named Phase 3 gates, and a failure here should say WHICH gate broke
      # rather than being one line in a 500-test summary.
      - name: Gate — API contract tests
        run: python -m pytest tests/test_api.py -q

      - name: Gate — model cards and governance
        run: python -m pytest tests/test_model_cards.py -q

      - name: Gate — explainability
        run: python -m pytest tests/test_explainability.py -q

      - name: Gate — monitoring drift metrics
        run: python -m pytest tests/test_monitoring.py -q

      - name: Gate — data governance (no PII, no caller content in logs)
        run: python -m pytest tests/test_data_governance.py -q

      - name: Gate — no-lookahead suite
        run: python -m pytest tests/ -q -k "lookahead or future_corruption or leak"

  runtime:
    name: pinned runtime + smoke pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # The LOCK: proves the exact environment the committed results were
      # produced in still resolves and installs. A range that resolves today
      # and a lock that resolves today are different claims.
      - name: Install pinned runtime
        run: pip install -r requirements.lock.txt

      - name: Gate — smoke pipeline (synthetic data, NOT a result)
        run: python scripts/smoke_pipeline.py

      - name: Gate — model cards are generated, not typed
        run: |
          # Regenerating must be a no-op. If it is not, a card was hand-edited
          # or an artifact moved without the cards being rebuilt — the exact
          # drift the generator exists to prevent.
          if [ -d data/gold ] && [ -f data/gold/dashboard_showcase.json ]; then
            python scripts/build_model_cards.py
            git diff --exit-code -- docs/MODEL_CARD_*.md
          else
            echo "::notice::Gold artifacts absent (DVC-managed, not in Git) —"
            echo "::notice::card regeneration is verified locally before a release tag."
          fi

      - name: Gate — artifact bundle preflight
        run: |
          if [ -f data/gold/dashboard_showcase.json ]; then
            python scripts/check_artifacts.py
          else
            echo "::notice::Gold artifacts absent — preflight is exercised by the"
            echo "::notice::Docker job below and locally before a release tag."
          fi

      - name: Gate — snapshot verification
        run: |
          if [ -f data/gold/snapshot_manifest.json ]; then
            python src/snapshot.py verify
          else
            echo "::notice::No snapshot manifest in the checkout (data/ is"
            echo "::notice::DVC-managed). Verified locally before a release tag."
          fi

  release-gates:
    name: release gates (needs the data bundle)
    # NEVER on pull_request. GitHub already withholds secrets from fork PRs,
    # but stating the boundary beats relying on a platform default — and this
    # repository is PUBLIC, so the job must not even attempt to run there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, NOT the default shallow clone. Snapshot verification
          # asks whether the manifest's producing commit is an ancestor of HEAD,
          # and `git merge-base --is-ancestor` cannot answer that when the
          # commit is not in the clone. Shallow, it failed as "different
          # history" on a history that was simply truncated.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pinned runtime and the S3 backend
        run: pip install -r requirements.lock.txt 'dvc[s3]'

      - name: Fetch the artifact bundle from R2
        env:
          # DVC reads these through boto3's default credential chain, so no
          # credential file is written and nothing can be committed by accident.
          # The bucket URL, region and endpoint are in the committed .dvc/config
          # and are not secrets.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::error::R2 credentials are not configured; the release gates"
            echo "::error::cannot run. Set R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY."
            exit 1
          fi
          dvc pull --quiet
          dvc status

      # The three gates CI previously could not run, plus the two it could.
      # --skip-tests because the suite has its own job above; running it twice
      # would double the wall clock to re-prove the same thing.
      - name: Release gates
        run: ./scripts/release_gates.sh --skip-tests

      - name: Confirm no credential file was written
        if: always()
        run: |
          # Credentials arrive as env vars precisely so nothing lands on disk.
          # If a step ever writes .dvc/config.local, it must not survive.
          test ! -f .dvc/config.local && echo "no credential file on disk"

  docker:
    name: image builds and refuses an empty bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t portfolio-ml:ci .

      - name: Gate — container runs as non-root
        run: |
          uid=$(docker run --rm portfolio-ml:ci id -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Gate — image carries no credentials
        run: |
          # .dockerignore excludes .env and .dvc/config.local; this asserts the
          # exclusion actually held, because gitignoring a secret does NOT keep
          # it out of a build context.
          for secret in .env .dvc/config.local; do
            if docker run --rm portfolio-ml:ci test -e "/app/$secret"; then
              echo "::error::$secret is present inside the image"
              exit 1
            fi
          done
          echo "no credential files in the image"

      - name: Gate — image carries no market data
        run: |
          count=$(docker run --rm portfolio-ml:ci sh -c "ls data/gold 2>/dev/null | wc -l")
          echo "data/gold entries in image: $count"
          test "$count" -eq 0

      - name: Gate — preflight refuses an incomplete bundle
        run: |
          # The image ships without data, so the default command must FAIL
          # loudly rather than serve a partial bundle.
          if docker run --rm portfolio-ml:ci python scripts/check_artifacts.py; then
            echo "::error::preflight passed with no artifacts present"
            exit 1
          fi
          echo "preflight correctly refused to start"
