stages:
  # ── Stage 1: Bronze — download raw data ────────────────────────────────────
  ingest:
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
      - src/schemas.py
    outs:
      - data/bronze/raw_prices.parquet
      - data/bronze/raw_macro.parquet
      # persist: true — ingest_bvc MERGES each download into this file because
      # the medias24 source is a rolling window (rows age out and can never be
      # re-downloaded). Without persist, `dvc repro` would delete the file
      # before running the stage and destroy the preserved history.
      - data/bronze/bvc_prices.parquet:
          persist: true
      - data/bronze/raw_bam_macro.parquet
    params:
      - params.yaml:
          - ingest.start_date

  # ── Stage 1b: Bronze — BVC dividend cache ──────────────────────────────────
  # Exists so the scrape is an OUTPUT, not only a declared dependency of
  # `clean`. DVC stores contents for outputs alone, so as a bare dep the
  # directory was tracked but never pushed: a fresh clone recovered every
  # committed result and still could not re-run the pipeline that made them
  # (verified against the R2 remote, 2026-08-03).
  scrape_dividends:
    cmd: python src/dividends.py
    deps:
      - src/dividends.py
    outs:
      # persist: true, for the same reason as bvc_prices.parquet above and one
      # more. DVC deletes an output before re-running its stage; here that
      # would discard the only local copy of the scraped HTML and re-fetch it
      # from casablanca-bourse.com. If the site is down, blocking us, or has
      # been redesigned again (it already broke BVCscrap.getDividend once),
      # the stage fails with the cache gone and `clean` then refuses to run.
      # The fetch is cache-first, so with persist the stage is a no-op unless
      # the cache is actually absent.
      - data/bronze/bvc_dividends:
          persist: true

  # ── Stage 1c: Bronze — official Bank Al-Maghrib USD/MAD reference rates ────
  # The single input that makes `full_2021` a MAD portfolio rather than a sum of
  # two currencies. It is exactly as determinative as the BVC dividend cache
  # (§17.8) and is tracked with the same discipline: an OUTPUT, so DVC stores and
  # pushes its contents, not a bare dep that a fresh clone could never rebuild.
  #
  # persist: true, for the same reasons as bvc_prices and bvc_dividends and one
  # more that is specific here. The BAM gateway allows 5 requests per minute, so
  # refetching this window costs ~4.4 hours. DVC deletes an output before
  # re-running its stage; without persist, any `dvc repro` touching this stage
  # would discard 1,225 rates and spend an afternoon re-earning them. The script
  # is resumable and cache-first, so with persist the stage is a no-op that only
  # refreshes the quality report.
  #
  # NOT a dependency of anything `etf_2017` touches: that universe is
  # single-currency USD and must acquire no FX dependency (currency.resolve_currency_policy).
  fetch_bam_fx:
    cmd: python scripts/backfill_bam_fx.py
    deps:
      - scripts/backfill_bam_fx.py
      - src/bam_fx.py
    outs:
      - data/bronze/bam_fx_reference.parquet:
          persist: true
      # The versioned quality control on the file above: gap structure plus the
      # FX quality-gate verdict. Rewritten even on a no-op run so it always
      # describes the data actually on disk.
      - data/bronze/bam_fx_reference_quality.json:
          persist: true
      # Dates BAM confirms carry no publication. Provenance, and what makes a
      # resume cheap instead of an hour of re-asking answered questions.
      - data/bronze/bam_fx_reference_no_publication.json:
          persist: true

  # ── Stage 2: Silver — clean, align, compute log-returns ────────────────────
  clean:
    cmd: python src/clean.py
    deps:
      - src/clean.py
      - src/schemas.py
      - src/dividends.py
      - src/currency.py
      - data/bronze/raw_prices.parquet
      - data/bronze/bvc_prices.parquet
      # The OFFICIAL USD/MAD rate is a real INPUT to Silver, not just a macro
      # feature: it is what expresses the USD-denominated ETF sleeve of the
      # 9-asset universe in the MAD numéraire before returns are computed
      # (src/currency.py). Undeclared, a refreshed FX fetch would change every
      # ETF return in log_returns.parquet without `dvc repro` noticing -- the
      # identical invisible-input bug as the undeclared BVC dividend cache
      # (AGENTS.md §17.8).
      #
      # NOTE this is bam_fx_reference.parquet, NOT raw_bam_macro.parquet. The
      # latter holds the Yahoo USDMAD=X quote, which this stage no longer reads
      # at all: its daily CHANGES correlate with the official rate's at 0.028
      # and it overstates FX volatility 6x. It survives as an input to the macro
      # FEATURES only (the `features` and `ml_features` stages below).
      - data/bronze/bam_fx_reference.parquet
      # The BVC dividend cache is a real INPUT to Silver, not a side file: it
      # is what makes the BVC series total-return rather than price-only
      # (docs/DIVIDEND_BIAS.md). Undeclared, a refreshed scrape would change
      # log_returns.parquet without `dvc repro` noticing -- the same invisible
      # -input class of bug as the 2026-07-20 Dagster gap (CLAUDE.md §17.7).
      - data/bronze/bvc_dividends
    outs:
      - data/silver/log_returns.parquet
      - data/silver/validation_report.json
      # ETF-only universe for Phase 2 dual-universe backtesting (2017+ history)
      - data/silver/log_returns_etf.parquet
      - data/silver/validation_report_log_returns_etf.json
    params:
      - params.yaml:
          - clean.ffill_limit

  # ── Stage 3: Gold — stationarity tests + macro features ────────────────────
  features:
    cmd: python src/features.py
    deps:
      - src/features.py
      - src/schemas.py
      - data/silver/log_returns.parquet
      - data/silver/log_returns_etf.parquet
      - data/bronze/raw_macro.parquet
      - data/bronze/raw_bam_macro.parquet
    outs:
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/macro_features.parquet
      - data/gold/stationarity_report.parquet
      # Publishes the numéraire of the two Gold returns matrices. §7 makes Gold
      # the only layer modelling code reads, so a currency recorded solely in
      # Silver is invisible to every consumer that matters.
      - data/gold/currency_manifest.json
    params:
      - params.yaml:
          - features.macro_lag_days

  # ── Stage 4: Phase 3 — causal, regime-relevant ML features ────────────────
  ml_features:
    cmd: python src/ml_features.py
    deps:
      - src/ml_features.py
      - src/utils.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/bronze/raw_macro.parquet
      - data/bronze/raw_bam_macro.parquet
    outs:
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_manifest.json
    params:
      - params.yaml:
          - ml_features.volatility_short_window
          - ml_features.volatility_long_window
          - ml_features.correlation_window
          - ml_features.correlation_min_periods
          - ml_features.macro_lag_days

  # ── Stage 5: Phase 2 comparison — Markowitz baselines, net-of-cost hurdle ──
  # Was a manually-regenerated artifact outside dvc.yaml until 2026-07-20,
  # when it drifted one universe-window stale after a data resync (CLAUDE.md
  # §17.1) — wired in here so `dvc repro`/`dvc status` catch that class of
  # staleness automatically instead of relying on someone remembering to
  # rerun the script by hand.
  phase2_hurdle:
    cmd: python src/run_backtest.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/memo.py
      - src/metrics.py
      - src/run_backtest.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
    outs:
      - data/gold/phase2_hurdle.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps

  # ── Stage 6: Phase 4 — HMM regime + dynamic covariance vs. the hurdle ──────
  # Slow (~10-15 min, dominated by DCC-GARCH's per-asset GARCH refits) —
  # `dvc repro` only reruns this when its deps actually change, same as any
  # other stage; not something to run on every commit.
  phase4_compare:
    cmd: python src/run_phase4.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/memo.py
      - src/metrics.py
      - src/regime.py
      - src/dcc_garch.py
      - src/run_phase4.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase2_hurdle.json
    outs:
      - data/gold/phase4_results.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - covariance_ewma.halflife_days
          - covariance_dcc_garch.garch_p
          - covariance_dcc_garch.garch_q
          - covariance_dcc_garch.dcc_a_init
          - covariance_dcc_garch.dcc_b_init
          - covariance_dcc_garch.rescale_factor
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy

  # ── Stage 7: Phase 4B — adaptive ML signal models (F7) vs. the hurdle ──────
  # RF + XGBoost only — LSTM was built and tested standalone but dropped
  # from this comparison after a torch+xgboost segfault; see CLAUDE.md.
  # `dvc repro` only reruns this when its deps actually change.
  phase4b_compare:
    cmd: python src/run_phase4b.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/memo.py
      - src/metrics.py
      - src/regime.py
      - src/dcc_garch.py
      - src/ml_signals.py
      - src/run_phase4.py
      - src/run_phase4b.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase4_results.json
    outs:
      - data/gold/phase4b_results.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - covariance_ewma.halflife_days
          - covariance_dcc_garch.garch_p
          - covariance_dcc_garch.garch_q
          - covariance_dcc_garch.dcc_a_init
          - covariance_dcc_garch.dcc_b_init
          - covariance_dcc_garch.rescale_factor
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy
          - ml_signals.short_window
          - ml_signals.long_window
          - ml_signals.momentum_windows
          - ml_signals.min_train_rows
          - ml_signals.condition_on_regime
          - ml_signals.random_forest
          - ml_signals.xgboost

  # ── Stage 8: Phase 4C — cost-aware optimization + mu regularization ────────
  # Phase 4B's negative result was diagnosable: rf_signal had the best GROSS
  # Sharpe on full_2021 (1.240) and lost 0.178 of it to 0.885 turnover. This
  # stage runs the ablation that attacks that — turnover penalty, mu shrinkage,
  # rank tilt, and best-mu+best-cov — against the same Phase 4 hurdle.
  # Slowest stage in the pipeline (adds a DCC-GARCH-covariance signal variant
  # on top of everything phase4b_compare already ran).
  phase4c_compare:
    cmd: python src/run_phase4c.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/memo.py
      - src/metrics.py
      - src/regime.py
      - src/dcc_garch.py
      - src/ml_signals.py
      - src/run_phase4.py
      - src/run_phase4b.py
      - src/run_phase4c.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase4_results.json
    outs:
      - data/gold/phase4c_results.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - covariance_ewma.halflife_days
          - covariance_dcc_garch.garch_p
          - covariance_dcc_garch.garch_q
          - covariance_dcc_garch.dcc_a_init
          - covariance_dcc_garch.dcc_b_init
          - covariance_dcc_garch.rescale_factor
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy
          - ml_signals.short_window
          - ml_signals.long_window
          - ml_signals.momentum_windows
          - ml_signals.min_train_rows
          - ml_signals.condition_on_regime
          - ml_signals.random_forest
          - ml_signals.xgboost
          - phase4c.turnover_penalty
          - phase4c.shrinkage_weight

  # ── Stage 9: Phase 5 — out-of-sample evaluation (forward-only CV, honest tuning) ─
  # Selects the F7 knobs leak-free (forward-only walk-forward CV —
  # `PurgedWalkForwardSplit` — for the model, validation-
  # segment net Sharpe for the levers), freezes them, and reports the verdict
  # on a held-out test segment with block-bootstrap CIs. Slowest stage: fits
  # RF/XGB per CV fold per grid point, then backtests the lever grid.
  phase5_compare:
    cmd: python src/run_phase5.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/memo.py
      - src/metrics.py
      - src/regime.py
      - src/ml_signals.py
      - src/purged_kfold.py
      - src/model_selection.py
      - src/run_phase4.py
      - src/run_phase5.py
      # The multiple-testing correction phase5 reports. Declared so the status
      # in paired_comparison_results.json cannot silently disagree with the
      # artifact that produced it — the same invisible-input class of bug as
      # the undeclared BVC dividend cache.
      - data/gold/reality_check_results.json
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase4_results.json
    outs:
      - data/gold/phase5_results.json
      - data/gold/dsr_trial_ledger.json
      # Phase 2 evidence artifacts: the realised forward-only fold geometry,
      # and the paired comparisons that a superiority claim would require.
      - data/gold/phase5_validation_protocol.json
      - data/gold/paired_comparison_results.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy
          - ml_signals.short_window
          - ml_signals.long_window
          - ml_signals.momentum_windows
          - ml_signals.min_train_rows
          - ml_signals.condition_on_regime
          - purged_cv.n_splits
          - purged_cv.embargo_frac
          - walk_forward_cv.min_train_dates
          - walk_forward_cv.val_dates
          - walk_forward_cv.n_splits
          - walk_forward_cv.embargo_dates
          - walk_forward_cv.label_horizon
          - walk_forward_cv.mode
          - walk_forward_cv.step_dates
          - phase5.test_frac
          - phase5.rf_grid
          - phase5.xgb_grid
          - phase5.shrink_grid
          - phase5.penalty_grid
          - phase5.bootstrap

  # ── Phase 6+7: dashboard data layer ───────────────────────────────────────
  # Regenerates every number the Streamlit dashboard shows, from committed Gold
  # inputs. Tracked as a stage (rather than run by hand) for the same reason
  # phase2_hurdle got a stage: a stakeholder-facing surface must never quote a
  # number that has silently drifted from its source.
  dashboard_data:
    cmd: python src/run_dashboard_data.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/memo.py
      - src/metrics.py
      - src/regime.py
      - src/run_phase4.py
      - src/run_dashboard_data.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase5_results.json
    params:
      - backtest.rebalance_freq
      - backtest.min_train_days
      - backtest.max_weight
      - backtest.risk_free_annual
      - backtest.costs_bps
      - regime.n_states
      - regime.features
      - regime.covariance_type
      - regime.n_restarts
      - regime.random_state_base
      - regime.min_regime_train_days
    outs:
      - data/gold/dashboard_equity.parquet
      - data/gold/dashboard_weights.parquet
      - data/gold/dashboard_regime.parquet
      - data/gold/dashboard_showcase.json

  # ── Phase 8: crisis-window analysis consumed by report, dashboard and API ──
  # This was previously a manually run experiment even though public-facing
  # surfaces quote it. Making it a DVC stage prevents the report from silently
  # referring to a crisis artifact produced from a different dashboard snapshot.
  crisis_windows:
    cmd: python experiments/crisis_windows.py
    deps:
      - experiments/crisis_windows.py
      - data/gold/dashboard_equity.parquet
      - data/gold/dashboard_regime.parquet
    outs:
      - data/gold/crisis_windows.json

  # ── Phase 3: explanation of the published decision ────────────────────────
  # Re-fits the ALREADY-SELECTED configurations at one rebalance date purely to
  # inspect them. No hyperparameter is chosen here and no comparison is made,
  # so no other artifact can move because of this stage. It is a DVC stage
  # rather than a script so the explanation cannot drift from the weights it
  # claims to explain.
  explainability:
    cmd: python src/run_explainability.py
    deps:
      - src/run_explainability.py
      - src/explainability.py
      - src/regime.py
      - src/strategies.py
      - src/ml_signals.py
      - src/memo.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/phase5_results.json
    params:
      - backtest.rebalance_freq
      - backtest.max_weight
      - backtest.risk_free_annual
      - regime.n_states
      - regime.features
      - regime.covariance_type
      - regime.n_restarts
      - regime.random_state_base
      - regime.min_regime_train_days
    outs:
      - data/gold/model_explanations.json

  # ── Phase 4: what each model ACTUALLY did, per rebalance ──────────────────
  # The raw records, persisted BEFORE any table is drawn from them. A table
  # without a saved source artifact is neither auditable nor reproducible, and
  # a fallback rate is precisely the kind of number a reader must be able to
  # re-derive rather than trust.
  fit_reports:
    cmd: python src/run_fit_reports.py
    deps:
      - src/run_fit_reports.py
      - src/telemetry.py
      - src/backtest.py
      - src/strategies.py
      - src/dcc_garch.py
      - src/ml_signals.py
      - src/regime.py
      - src/memo.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_etf.parquet
    params:
      - backtest.rebalance_freq
      - backtest.min_train_days
      - backtest.max_weight
      - backtest.risk_free_annual
      - backtest.costs_bps
      - regime.n_states
      - regime.n_restarts
      - regime.random_state_base
      - regime.covariance_type
      - regime.min_regime_train_days
    outs:
      - data/gold/fit_reports.parquet
      - data/gold/fit_report_summary.json

  # ── Multiple-testing correction over the WHOLE search ─────────────────────
  # Closes Phase 5's `not_established` position. Evaluates every REACHABLE
  # candidate (15 hyperparameter configs x 16 lever combinations = 240) on the
  # frozen test dates, stores each series, and runs White's Reality Check and
  # Hansen's SPA over the set.
  #
  # Expensive by nature: ~18 min on full_2021, ~3.4 h on etf_2017. That cost is
  # the reason the position was `not_established` until now, and it is paid once
  # per data snapshot rather than per read.
  reality_check:
    cmd: python src/run_reality_check.py
    deps:
      - src/run_reality_check.py
      - src/metrics.py
      - src/run_phase5.py
      - src/strategies.py
      - src/ml_signals.py
      - src/regime.py
      - src/memo.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_etf.parquet
    params:
      - backtest.rebalance_freq
      - backtest.min_train_days
      - backtest.max_weight
      - backtest.risk_free_annual
      - backtest.costs_bps
      - phase5.test_frac
      - phase5.rf_grid
      - phase5.xgb_grid
      - phase5.shrink_grid
      - phase5.penalty_grid
      - phase5.bootstrap
      - ml_signals.min_train_rows
    outs:
      - data/gold/reality_check_series.parquet
      - data/gold/reality_check_results.json

  # ── Nested walk-forward — Phase 5's documented stretch goal ───────────────
  # Promoted from a hand-run experiment to a stage after it went stale
  # invisibly: produced 2026-07-28 from a MIXED-CURRENCY full_2021, it survived
  # the base-currency correction untouched because nothing tracked it, and
  # Chapter 5 would have rendered its (now sign-flipped) conclusion beside
  # rebuilt numbers. Being outside the graph is exactly why nobody noticed —
  # the same lesson as the undeclared BVC dividend cache (AGENTS.md §17.8).
  #
  # Scoped to full_2021: etf_2017's test segment is already 7.6 years after the
  # deep window and is no longer the underpowered case.
  nested_walkforward:
    cmd: python experiments/nested_walkforward.py
    deps:
      - experiments/nested_walkforward.py
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/model_selection.py
      - src/purged_kfold.py
      - src/ml_signals.py
      - src/regime.py
      - src/memo.py
      - src/provenance.py
      - src/run_phase4.py
      - data/gold/log_returns.parquet
      - data/gold/ml_features_full.parquet
      # The numéraire this result is computed under. Declared so a currency
      # change invalidates the experiment rather than leaving it to be spotted.
      - data/gold/currency_manifest.json
    outs:
      - data/gold/nested_walkforward_results.json
    params:
      - backtest.rebalance_freq
      - backtest.min_train_days
      - backtest.max_weight
      - backtest.risk_free_annual
      - backtest.costs_bps
      - regime.n_states
      - regime.n_restarts
      - regime.random_state_base
      - regime.covariance_type
      - regime.min_regime_train_days
      - ml_signals.min_train_rows
      - ml_signals.condition_on_regime
      - ml_signals.short_window
      - ml_signals.long_window
      - ml_signals.momentum_windows
      - purged_cv.n_splits
      - purged_cv.embargo_frac
      - phase5.rf_grid
      - phase5.xgb_grid
      - phase5.shrink_grid
      - phase5.penalty_grid
      - phase5.bootstrap

  # ── Weight-cap sweep on the deep ETF window ───────────────────────────────
  # Tracked for the same reason as nested_walkforward: it was a hand-run
  # experiment whose result Chapter 5 consumes, and an untracked result is one
  # nobody can tell has gone stale.
  #
  # This one HAPPENS to have survived the base-currency correction intact — it
  # is scoped to etf_2017, which is single-currency USD and did not move. That
  # was luck rather than a property anyone could verify, which is the point:
  # recording base_currency=USD in its provenance makes "unaffected" checkable.
  etf_cap_sweep:
    cmd: python experiments/etf_cap_verdict.py
    deps:
      - experiments/etf_cap_verdict.py
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/regime.py
      - src/memo.py
      - src/provenance.py
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/currency_manifest.json
    outs:
      - data/gold/etf_cap_verdict.json
    params:
      - backtest.rebalance_freq
      - backtest.min_train_days
      - backtest.risk_free_annual
      - backtest.costs_bps
      - regime.n_states
      - regime.n_restarts
      - regime.random_state_base
      - regime.covariance_type
      - regime.min_regime_train_days
      - phase5.bootstrap

  # ── Risk-free sensitivity of the reported Sharpes ─────────────────────────
  # `risk_free_annual: 0.0` was flagged "revisit in Phase 5" and never was.
  # Tracked because the answer depends on BOTH the equity artifact and the
  # Bronze policy-rate series, so a rebuild of either silently invalidates it.
  #
  # Note the Bronze dependency: TAUX_DIR is MAD and is applied only to the MAD
  # universe. See the module docstring for why it is not substituted into the
  # USD one.
  risk_free_sensitivity:
    cmd: python experiments/risk_free_sensitivity.py
    deps:
      - experiments/risk_free_sensitivity.py
      - src/provenance.py
      - data/gold/dashboard_equity.parquet
      - data/bronze/raw_bam_macro.parquet
      - data/gold/currency_manifest.json
    outs:
      - data/gold/risk_free_sensitivity.json
    params:
      - backtest.risk_free_annual

  # ── Non-synchronous trading and the covariance input ──────────────────────
  # Tracked for the same reason as nested_walkforward and etf_cap_sweep: a
  # hand-run experiment whose result the report consumes, and an untracked
  # result is one nobody can tell has gone stale.
  #
  # This one is NOT incidental to the base currency. Its whole subject is the
  # cross-market covariance of `full_2021`, the universe the MAD conversion
  # moved, so its numbers are only meaningful against the converted returns.
  # Listing log_returns.parquet and currency_manifest.json as deps is what
  # makes a re-run mandatory if either changes.
  nonsync_covariance:
    cmd: python experiments/nonsync_covariance.py
    deps:
      - experiments/nonsync_covariance.py
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/provenance.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/currency_manifest.json
    outs:
      - data/gold/nonsync_covariance.json
    params:
      - backtest.rebalance_freq
      - backtest.min_train_days
      - backtest.max_weight
      - backtest.risk_free_annual
      - backtest.costs_bps
      - phase5.bootstrap

  # ── Phase 3: offline monitoring reference ─────────────────────────────────
  # Pins the reference distributions a future drift check measures against.
  # The reference is the Phase 5 train+validation segment ONLY — including the
  # frozen test segment would compare that window against itself and report
  # stability by construction.
  #
  # This stage WRITES A REFERENCE. It does not monitor anything: there is no
  # schedule, no alerting path and no trigger. `--evaluate` is a human running
  # a command (docs/MONITORING_RUNBOOK.md).
  monitoring_baseline:
    cmd: python src/run_monitoring_baseline.py
    deps:
      - src/run_monitoring_baseline.py
      - src/monitoring.py
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/dashboard_weights.parquet
      - data/gold/dashboard_regime.parquet
      - data/gold/phase5_results.json
    params:
      - backtest.max_weight
    outs:
      - data/gold/monitoring_baseline.json

  # ── CI wiring check — SYNTHETIC DATA, NOT A RESULT ────────────────────────
  # Runs the real engine and the real strategy classes over a small seeded
  # synthetic universe in ~15s, so a broken import, a renamed parameter or a
  # cap violation fails fast instead of surfacing 45 minutes into
  # `phase4c_compare`. It writes to data/smoke/, never data/gold/, and is NOT
  # a dependency of `snapshot_manifest`: it can never stand in for the real
  # evaluation, and its numbers must never be cited.
  smoke:
    cmd: python scripts/smoke_pipeline.py
    deps:
      - scripts/smoke_pipeline.py
      - src/backtest.py
      - src/strategies.py
      - src/memo.py
      - src/regime.py
      - src/ml_signals.py
    outs:
      - data/smoke/smoke_results.json

  # ── Release gate: one manifest tying all public artifacts to one snapshot ──
  # The manifest hashes raw inputs, Gold matrices, results, dashboard artifacts,
  # and the crisis study. It never embeds market data, so it can accompany a
  # report/release while data remains in DVC or a controlled release archive.
  snapshot_manifest:
    cmd: python src/snapshot.py write
    deps:
      - src/snapshot.py
      - params.yaml
      - requirements.txt
      - requirements.lock.txt
      - data/bronze/raw_prices.parquet
      - data/bronze/bvc_prices.parquet
      - data/bronze/raw_macro.parquet
      - data/bronze/raw_bam_macro.parquet
      # The official FX rate now determines every full_2021 return, so it belongs
      # in the release manifest beside the price and dividend inputs.
      - data/bronze/bam_fx_reference.parquet
      - data/bronze/bam_fx_reference_quality.json
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/currency_manifest.json
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/phase2_hurdle.json
      - data/gold/phase4_results.json
      - data/gold/phase4b_results.json
      - data/gold/phase4c_results.json
      - data/gold/phase5_results.json
      - data/gold/dsr_trial_ledger.json
      - data/gold/phase5_validation_protocol.json
      - data/gold/paired_comparison_results.json
      - data/gold/model_explanations.json
      - data/gold/monitoring_baseline.json
      - data/gold/fit_reports.parquet
      - data/gold/fit_report_summary.json
      - data/gold/reality_check_series.parquet
      - data/gold/reality_check_results.json
      - data/gold/dashboard_showcase.json
      - data/gold/dashboard_equity.parquet
      - data/gold/dashboard_weights.parquet
      - data/gold/dashboard_regime.parquet
      - data/gold/crisis_windows.json
    outs:
      - data/gold/snapshot_manifest.json

  # ── global_2004 experiment — checkpoint 1: DATA READINESS ─────────────────
  # Builds Bronze -> Silver -> Gold for the frozen ten-instrument universe and
  # writes the readiness artifact. Computes NO performance quantity: no Sharpe,
  # no portfolio return, no drawdown, no turnover. The allocation-freedom and
  # no-lookahead gates are derived from WEIGHTS ONLY.
  #
  # Deps include params_global_2004.yaml (the frozen instrument set and the
  # readiness thresholds) and the pre-registration itself, because
  # tests/test_global_universe.py asserts the shipped config still equals the
  # frozen document — a change to either must invalidate this stage.
  #
  # NOT wired into any Q1/Q2 stage. Evaluation is a separate, later checkpoint
  # and must not run until this artifact reports READY.
  # Bronze is its own stage, mirroring `ingest`: the download is a distinct
  # act from the transformation, and separating them means `dvc repro` on a
  # code change does not re-hit ten Yahoo endpoints.
  #
  # persist: true, for the same reason as the other Bronze outputs. DVC deletes
  # an output before re-running its stage; without persist, any repro touching
  # this stage would discard the only local copy and re-download. The runner is
  # cache-first, so with persist the stage is a no-op once the file exists.
  ingest_global:
    cmd: python -c "import sys; sys.path.insert(0, 'src'); from global_universe import ROOT, ingest_global_prices, load_global_config; cfg = load_global_config(); ingest_global_prices(cfg['tickers'], cfg['start_date'], ROOT / cfg['paths']['bronze_prices'])"
    deps:
      - src/global_universe.py
      - params_global_2004.yaml
    outs:
      - data/bronze/raw_global_prices.parquet:
          persist: true

  global_2004_data:
    cmd: python src/run_global_2004_data.py
    deps:
      - src/run_global_2004_data.py
      - src/global_universe.py
      - src/clean.py
      - src/ml_features.py
      - src/backtest.py
      - src/strategies.py
      - params_global_2004.yaml
      - docs/GLOBAL_UNIVERSE_PREREGISTRATION.md
      - data/bronze/raw_global_prices.parquet
      - data/bronze/raw_macro.parquet
    outs:
      - data/silver/log_returns_global.parquet
      - data/gold/log_returns_global.parquet
      - data/gold/ml_features_global.parquet
      - data/gold/ml_features_global_manifest.json
      - data/gold/global_2004_readiness.json
    params:
      - backtest.max_weight
      - backtest.rebalance_freq
      - backtest.min_train_days
      - clean.ffill_limit
      - ml_features.macro_lag_days
      - ml_features.volatility_short_window
      - ml_features.volatility_long_window
      - ml_features.correlation_window
      - ml_features.correlation_min_periods

  # ── global_2004 Q1 — ONE pre-specified comparison ─────────────────────────
  # regime_conditional vs max_sharpe, net of costs, on the frozen 35% test
  # segment. Gated on the readiness artifact: the script refuses to run if it
  # reports anything but READY, or if it was produced from a dirty tree.
  #
  # NO DSR / Reality Check / SPA here. Q1 is a single hypothesis fixed before
  # any result existed; the correction belongs to Q2's search. Enforced by
  # tests/test_global_2004_q1.py, which greps the artifact for those keys.
  #
  # RUN-ONCE. A technical defect permits a documented full rerun; an
  # unfavourable result does not.
  global_2004_q1:
    cmd: python src/run_global_2004_q1.py
    deps:
      - src/run_global_2004_q1.py
      - src/global_universe.py
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/regime.py
      - src/run_phase5.py
      - params_global_2004.yaml
      - docs/GLOBAL_UNIVERSE_PREREGISTRATION.md
      - data/gold/log_returns_global.parquet
      - data/gold/ml_features_global.parquet
      - data/gold/global_2004_readiness.json
    outs:
      - data/gold/global_2004_q1_results.json
    params:
      - backtest.max_weight
      - backtest.rebalance_freq
      - backtest.min_train_days
      - backtest.risk_free_annual
      - backtest.costs_bps
      - regime.n_states
      - regime.n_restarts
      - regime.random_state_base
      - regime.covariance_type
      - regime.min_regime_train_days
      - regime.bull_strategy
      - regime.bear_strategy
      - phase5.test_frac
      - phase5.bootstrap
