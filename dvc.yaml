stages:
  # ── Stage 1: Bronze — download raw data ────────────────────────────────────
  ingest:
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
      - src/schemas.py
    outs:
      - data/bronze/raw_prices.parquet
      - data/bronze/raw_macro.parquet
      # persist: true — ingest_bvc MERGES each download into this file because
      # the medias24 source is a rolling window (rows age out and can never be
      # re-downloaded). Without persist, `dvc repro` would delete the file
      # before running the stage and destroy the preserved history.
      - data/bronze/bvc_prices.parquet:
          persist: true
      - data/bronze/raw_bam_macro.parquet
    params:
      - params.yaml:
          - ingest.start_date

  # ── Stage 2: Silver — clean, align, compute log-returns ────────────────────
  clean:
    cmd: python src/clean.py
    deps:
      - src/clean.py
      - src/schemas.py
      - data/bronze/raw_prices.parquet
      - data/bronze/bvc_prices.parquet
    outs:
      - data/silver/log_returns.parquet
      - data/silver/validation_report.json
      # ETF-only universe for Phase 2 dual-universe backtesting (2017+ history)
      - data/silver/log_returns_etf.parquet
      - data/silver/validation_report_log_returns_etf.json
    params:
      - params.yaml:
          - clean.ffill_limit

  # ── Stage 3: Gold — stationarity tests + macro features ────────────────────
  features:
    cmd: python src/features.py
    deps:
      - src/features.py
      - src/schemas.py
      - data/silver/log_returns.parquet
      - data/silver/log_returns_etf.parquet
      - data/bronze/raw_macro.parquet
      - data/bronze/raw_bam_macro.parquet
    outs:
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/macro_features.parquet
      - data/gold/stationarity_report.parquet
    params:
      - params.yaml:
          - features.macro_lag_days

  # ── Stage 4: Phase 3 — causal, regime-relevant ML features ────────────────
  ml_features:
    cmd: python src/ml_features.py
    deps:
      - src/ml_features.py
      - src/utils.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/bronze/raw_macro.parquet
      - data/bronze/raw_bam_macro.parquet
    outs:
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_manifest.json
    params:
      - params.yaml:
          - ml_features.volatility_short_window
          - ml_features.volatility_long_window
          - ml_features.correlation_window
          - ml_features.correlation_min_periods
          - ml_features.macro_lag_days
