stages:
  # ── Stage 1: Bronze — download raw data ────────────────────────────────────
  ingest:
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
      - src/schemas.py
    outs:
      - data/bronze/raw_prices.parquet
      - data/bronze/raw_macro.parquet
      # persist: true — ingest_bvc MERGES each download into this file because
      # the medias24 source is a rolling window (rows age out and can never be
      # re-downloaded). Without persist, `dvc repro` would delete the file
      # before running the stage and destroy the preserved history.
      - data/bronze/bvc_prices.parquet:
          persist: true
      - data/bronze/raw_bam_macro.parquet
    params:
      - params.yaml:
          - ingest.start_date

  # ── Stage 2: Silver — clean, align, compute log-returns ────────────────────
  clean:
    cmd: python src/clean.py
    deps:
      - src/clean.py
      - src/schemas.py
      - data/bronze/raw_prices.parquet
      - data/bronze/bvc_prices.parquet
    outs:
      - data/silver/log_returns.parquet
      - data/silver/validation_report.json
      # ETF-only universe for Phase 2 dual-universe backtesting (2017+ history)
      - data/silver/log_returns_etf.parquet
      - data/silver/validation_report_log_returns_etf.json
    params:
      - params.yaml:
          - clean.ffill_limit

  # ── Stage 3: Gold — stationarity tests + macro features ────────────────────
  features:
    cmd: python src/features.py
    deps:
      - src/features.py
      - src/schemas.py
      - data/silver/log_returns.parquet
      - data/silver/log_returns_etf.parquet
      - data/bronze/raw_macro.parquet
      - data/bronze/raw_bam_macro.parquet
    outs:
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/macro_features.parquet
      - data/gold/stationarity_report.parquet
    params:
      - params.yaml:
          - features.macro_lag_days

  # ── Stage 4: Phase 3 — causal, regime-relevant ML features ────────────────
  ml_features:
    cmd: python src/ml_features.py
    deps:
      - src/ml_features.py
      - src/utils.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/bronze/raw_macro.parquet
      - data/bronze/raw_bam_macro.parquet
    outs:
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/ml_features_manifest.json
    params:
      - params.yaml:
          - ml_features.volatility_short_window
          - ml_features.volatility_long_window
          - ml_features.correlation_window
          - ml_features.correlation_min_periods
          - ml_features.macro_lag_days

  # ── Stage 5: Phase 2 comparison — Markowitz baselines, net-of-cost hurdle ──
  # Was a manually-regenerated artifact outside dvc.yaml until 2026-07-20,
  # when it drifted one universe-window stale after a data resync (CLAUDE.md
  # §17.1) — wired in here so `dvc repro`/`dvc status` catch that class of
  # staleness automatically instead of relying on someone remembering to
  # rerun the script by hand.
  phase2_hurdle:
    cmd: python src/run_backtest.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/run_backtest.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
    outs:
      - data/gold/phase2_hurdle.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps

  # ── Stage 6: Phase 4 — HMM regime + dynamic covariance vs. the hurdle ──────
  # Slow (~10-15 min, dominated by DCC-GARCH's per-asset GARCH refits) —
  # `dvc repro` only reruns this when its deps actually change, same as any
  # other stage; not something to run on every commit.
  phase4_compare:
    cmd: python src/run_phase4.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/regime.py
      - src/dcc_garch.py
      - src/run_phase4.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase2_hurdle.json
    outs:
      - data/gold/phase4_results.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - covariance_ewma.halflife_days
          - covariance_dcc_garch.garch_p
          - covariance_dcc_garch.garch_q
          - covariance_dcc_garch.dcc_a_init
          - covariance_dcc_garch.dcc_b_init
          - covariance_dcc_garch.rescale_factor
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy

  # ── Stage 7: Phase 4B — adaptive ML signal models (F7) vs. the hurdle ──────
  # RF + XGBoost only — LSTM was built and tested standalone but dropped
  # from this comparison after a torch+xgboost segfault; see CLAUDE.md.
  # `dvc repro` only reruns this when its deps actually change.
  phase4b_compare:
    cmd: python src/run_phase4b.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/regime.py
      - src/dcc_garch.py
      - src/ml_signals.py
      - src/run_phase4.py
      - src/run_phase4b.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase4_results.json
    outs:
      - data/gold/phase4b_results.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - covariance_ewma.halflife_days
          - covariance_dcc_garch.garch_p
          - covariance_dcc_garch.garch_q
          - covariance_dcc_garch.dcc_a_init
          - covariance_dcc_garch.dcc_b_init
          - covariance_dcc_garch.rescale_factor
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy
          - ml_signals.short_window
          - ml_signals.long_window
          - ml_signals.momentum_windows
          - ml_signals.min_train_rows
          - ml_signals.condition_on_regime
          - ml_signals.random_forest
          - ml_signals.xgboost

  # ── Stage 8: Phase 4C — cost-aware optimization + mu regularization ────────
  # Phase 4B's negative result was diagnosable: rf_signal had the best GROSS
  # Sharpe on full_2021 (1.240) and lost 0.178 of it to 0.885 turnover. This
  # stage runs the ablation that attacks that — turnover penalty, mu shrinkage,
  # rank tilt, and best-mu+best-cov — against the same Phase 4 hurdle.
  # Slowest stage in the pipeline (adds a DCC-GARCH-covariance signal variant
  # on top of everything phase4b_compare already ran).
  phase4c_compare:
    cmd: python src/run_phase4c.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/regime.py
      - src/dcc_garch.py
      - src/ml_signals.py
      - src/run_phase4.py
      - src/run_phase4b.py
      - src/run_phase4c.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase4_results.json
    outs:
      - data/gold/phase4c_results.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - covariance_ewma.halflife_days
          - covariance_dcc_garch.garch_p
          - covariance_dcc_garch.garch_q
          - covariance_dcc_garch.dcc_a_init
          - covariance_dcc_garch.dcc_b_init
          - covariance_dcc_garch.rescale_factor
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy
          - ml_signals.short_window
          - ml_signals.long_window
          - ml_signals.momentum_windows
          - ml_signals.min_train_rows
          - ml_signals.condition_on_regime
          - ml_signals.random_forest
          - ml_signals.xgboost
          - phase4c.turnover_penalty
          - phase4c.shrinkage_weight

  # ── Stage 9: Phase 5 — out-of-sample evaluation (purged CV, honest tuning) ─
  # Selects the F7 knobs leak-free (purged K-Fold for the model, validation-
  # segment net Sharpe for the levers), freezes them, and reports the verdict
  # on a held-out test segment with block-bootstrap CIs. Slowest stage: fits
  # RF/XGB per CV fold per grid point, then backtests the lever grid.
  phase5_compare:
    cmd: python src/run_phase5.py
    deps:
      - src/backtest.py
      - src/strategies.py
      - src/metrics.py
      - src/regime.py
      - src/ml_signals.py
      - src/purged_kfold.py
      - src/model_selection.py
      - src/run_phase4.py
      - src/run_phase5.py
      - data/gold/log_returns.parquet
      - data/gold/log_returns_etf.parquet
      - data/gold/ml_features_etf.parquet
      - data/gold/ml_features_full.parquet
      - data/gold/phase4_results.json
    outs:
      - data/gold/phase5_results.json
      - data/gold/dsr_trial_ledger.json
    params:
      - params.yaml:
          - backtest.rebalance_freq
          - backtest.min_train_days
          - backtest.max_weight
          - backtest.risk_free_annual
          - backtest.costs_bps
          - regime.n_states
          - regime.features
          - regime.covariance_type
          - regime.n_restarts
          - regime.random_state_base
          - regime.min_regime_train_days
          - regime.bull_strategy
          - regime.bear_strategy
          - ml_signals.short_window
          - ml_signals.long_window
          - ml_signals.momentum_windows
          - ml_signals.min_train_rows
          - ml_signals.condition_on_regime
          - purged_cv.n_splits
          - purged_cv.embargo_frac
          - phase5.test_frac
          - phase5.rf_grid
          - phase5.xgb_grid
          - phase5.shrink_grid
          - phase5.penalty_grid
          - phase5.bootstrap
