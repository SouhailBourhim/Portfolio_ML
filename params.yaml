# Pipeline parameters — edit here and run `dvc repro` to re-execute only affected stages.

ingest:
  start_date: "2017-01-01"   # covers COVID crash (2020) and 2022 rate shock

clean:
  ffill_limit: 5             # max consecutive business days to forward-fill

features:
  macro_lag_days: 1          # lag applied to macro features to prevent lookahead bias

ml_features:
  volatility_short_window: 21
  volatility_long_window: 63
  correlation_window: 63
  correlation_min_periods: 42
  # Intentionally separate from features.macro_lag_days above: that lag governs
  # the Phase 1 Gold macro_features; this one governs the Phase 3 ML signals.
  # Same value today, but the two stages are tunable independently.
  macro_lag_days: 1
  outputs:
    etf_2017: "data/gold/ml_features_etf.parquet"
    full_2021: "data/gold/ml_features_full.parquet"
  manifest_path: "data/gold/ml_features_manifest.json"

backtest:
  rebalance_freq: "ME"       # month-end (pandas offset alias) — decided 2026-07-05
  min_train_days: 252        # 1 trading year of history before the first rebalance
  max_weight: 0.25           # per-asset cap; long-only is implied by the optimizer bounds
  risk_free_annual: 0.0      # MVP simplification; revisit in Phase 5
  costs_bps:                 # one-way transaction costs applied to turnover
    etf: 10                  # liquid US-listed ETFs
    bvc: 30                  # BVC illiquidity premium (CIH/BCP carry standing flags)
  universes:                 # every strategy runs on BOTH (dual-universe design)
    etf_2017: "data/gold/log_returns_etf.parquet"    # 5 ETFs, includes COVID + 2022
    full_2021: "data/gold/log_returns.parquet"       # 9 assets, BVC-limited window

# ── Phase 4: covariance ablation ladder, rung 3 (EWMA) ──────────────────────
covariance_ewma:
  halflife_days: 63          # matches ml_features' volatility_long_window for repo consistency

# ── Phase 4: covariance ablation ladder, rung 4 (DCC-GARCH, Engle 2002) ─────
covariance_dcc_garch:
  garch_p: 1
  garch_q: 1
  dcc_a_init: 0.02           # short-run correlation shock persistence, starting guess
  dcc_b_init: 0.95           # long-run correlation persistence, starting guess
  rescale_factor: 100        # arch's own convention for MLE numerical stability; undone after fit

# ── Phase 4: HMM regime detection ───────────────────────────────────────────
regime:
  n_states: 2                # bull/bear MVP — see CLAUDE.md §12 for the 3-state trade-off
  features: ["MARKET_RETURN", "MARKET_VOL_SHORT", "AVG_PAIRWISE_CORR"]  # causal Phase 3 outputs
  covariance_type: "diag"    # fewer params than "full" given 252-2500 row training windows
  n_restarts: 5              # multi-start EM, keep highest log-likelihood (hmmlearn is seed-sensitive)
  random_state_base: 0
  min_regime_train_days: 252 # below this: neutral 50/50 posterior fallback, never raise
  bull_strategy: "max_sharpe"
  bear_strategy: "min_variance_lw"

phase4:
  results_path: "data/gold/phase4_results.json"

# ── Phase 4B: adaptive ML signal models (F7) ────────────────────────────────
ml_signals:
  short_window: 21               # matches ml_features.volatility_short_window
  long_window: 63                # matches ml_features.volatility_long_window
  momentum_windows: [5, 21, 63]
  min_train_rows: 504            # ~2 years of pooled-panel rows before trusting the model
  cov_estimator: "ledoit_wolf"
  condition_on_regime: true
  outputs:
    etf_2017: "data/gold/ml_signal_features_etf.parquet"
    full_2021: "data/gold/ml_signal_features_full.parquet"
  manifest_path: "data/gold/ml_signal_features_manifest.json"
  random_forest:
    n_estimators: 200
    max_depth: 4
    min_samples_leaf: 20
    random_state: 0
  xgboost:
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.05
    random_state: 0
  # lstm block intentionally removed: LSTMSignalStrategy was built and
  # tested standalone, then dropped from this pass after torch + xgboost
  # segfaulted when loaded together in the same process on this machine.
  # Deferred, not abandoned — see CLAUDE.md's Phase 4B notes.

# ── Phase 4C — cost-aware optimization + mu regularization ──────────────────
# Phase 4B's negative result was diagnosable, not mysterious: on full_2021
# rf_signal had the BEST gross Sharpe of the whole comparison (1.240, above
# regime_conditional's 1.204) and lost 0.178 of it to 0.885 turnover. These
# knobs attack that: price the trade, and stop trusting the predicted mu's
# magnitudes (Chopra & Ziemba 1993).
#
# NONE of these are tuned — they are judgement calls, and Phase 5's purged
# K-Fold CV is the honest place to select them. Report them as chosen, not
# as optimized.
phase4c:
  results_path: "data/gold/phase4c_results.json"
  # λ in "annualized Sharpe sacrificed per unit of turnover". 1.0 means the
  # optimizer will give up 1.0 Sharpe to avoid fully replacing the portfolio.
  turnover_penalty: 1.0
  # Weight on the model's prediction when mu_transform: "shrink";
  # 0.0 == the naive sample mean, 1.0 == the raw prediction.
  shrinkage_weight: 0.5

phase4b:
  results_path: "data/gold/phase4b_results.json"

# ── Phase 5 — Out-of-Sample Evaluation ─────────────────────────────────────
# Resolves the Phase 4C cliffhanger HONESTLY: rf_signal_shrunk reached 1.117
# vs the 1.1215 hurdle with shrinkage_weight/turnover_penalty CHOSEN, not
# tuned. Phase 5 selects them leak-free (purged K-Fold for the ML model,
# validation-segment net Sharpe for the portfolio levers), freezes them, and
# reports the verdict on a held-out test segment the selection never saw.
purged_cv:
  n_splits: 5
  embargo_frac: 0.02          # fraction of unique dates embargoed after each fold

# ── Fundamentals experiment — F7 features beyond price history ──────────────
# Phase 5 established that the F7 signal, tuned honestly on prices alone, is
# statistically INDISTINGUISHABLE from regime_conditional out-of-sample. The
# deep-Morocco experiment (2005-2024, 12 stocks, 56k pooled rows) then ruled
# out "more price history" as the missing ingredient: purged-CV IC improved
# ~2-4x, portfolio edge did not. That result explicitly redirects the alpha
# search to a different data class: fundamentals.
#
# Source: stockanalysis.com (S&P Global-sourced, ~5 yr annual + ~10 semi-annual
# periods, free, robots-allowed for '*'). Period-end dates only — publication
# date is not exposed, so a conservative fixed lag is applied on every row
# (§15.8 causal-discipline convention, enforced by unit test).
fundamentals:
  # BVC tickers where fundamentals meaningfully move the signal. ETFs are
  # deliberately excluded — an ETF's "fundamentals" are a holdings weighting,
  # a different modelling problem out of scope for this pass.
  tickers: ["IAM", "ATW", "CIH", "BCP"]
  # Fields to keep on the SEMI-ANNUAL ratios page. Verified 2026-07-23 on all
  # four tickers: only these four have multi-period coverage. ROE and margin
  # ratios (grossMargin/operatingMargin/profitMargin) are annual-only for
  # Moroccan issuers — S&P doesn't publish half-year profitability ratios
  # here. Requesting a field not on the page produces no column (never a
  # silent NaN column), so we list only what actually comes through.
  ratio_fields: ["pe", "pb", "ps", "debtequity"]
  # Semi-annual publication delay in Morocco is typically 60-90 days after
  # period-end (AMMC deadline). 90d is the conservative bound; any real
  # publication faster than that is a bonus, not a leak.
  publication_lag_days: 90
  cache_dir: "data/bronze/fundamentals"
  output_path: "data/gold/fundamentals_features.parquet"
  manifest_path: "data/gold/fundamentals_manifest.json"

phase5:
  results_path: "data/gold/phase5_results.json"
  ledger_path: "data/gold/dsr_trial_ledger.json"
  test_frac: 0.35             # final 35% of each universe's OOS window = frozen test set
  # ML hyperparameter grids searched by purged K-Fold (scored by information coefficient)
  rf_grid:
    max_depth: [3, 4, 6]
    min_samples_leaf: [10, 20]
    n_estimators: [200]
  xgb_grid:
    max_depth: [2, 3, 4]
    learning_rate: [0.03, 0.05, 0.10]
    n_estimators: [200]
  # Portfolio-lever grids selected by validation-segment net Sharpe (per model)
  shrink_grid: [0.25, 0.5, 0.75, 1.0]
  penalty_grid: [0.0, 0.5, 1.0, 2.0]
  bootstrap:
    block_len: 21             # ~one trading month; preserves return autocorrelation
    n_boot: 2000
    alpha: 0.10               # 90% confidence interval
    seed: 0
