# Pipeline parameters — edit here and run `dvc repro` to re-execute only affected stages.

ingest:
  start_date: "2017-01-01"   # covers COVID crash (2020) and 2022 rate shock

clean:
  ffill_limit: 5             # max consecutive business days to forward-fill

features:
  macro_lag_days: 1          # lag applied to macro features to prevent lookahead bias

ml_features:
  volatility_short_window: 21
  volatility_long_window: 63
  correlation_window: 63
  correlation_min_periods: 42
  # Intentionally separate from features.macro_lag_days above: that lag governs
  # the Phase 1 Gold macro_features; this one governs the Phase 3 ML signals.
  # Same value today, but the two stages are tunable independently.
  macro_lag_days: 1
  outputs:
    etf_2017: "data/gold/ml_features_etf.parquet"
    full_2021: "data/gold/ml_features_full.parquet"
  manifest_path: "data/gold/ml_features_manifest.json"

backtest:
  rebalance_freq: "ME"       # month-end (pandas offset alias) — decided 2026-07-05
  min_train_days: 252        # 1 trading year of history before the first rebalance
  max_weight: 0.25           # per-asset cap; long-only is implied by the optimizer bounds
  risk_free_annual: 0.0      # MVP simplification; revisit in Phase 5
  costs_bps:                 # one-way transaction costs applied to turnover
    etf: 10                  # liquid US-listed ETFs
    bvc: 30                  # BVC illiquidity premium (CIH/BCP carry standing flags)
  universes:                 # every strategy runs on BOTH (dual-universe design)
    etf_2017: "data/gold/log_returns_etf.parquet"    # 5 ETFs, includes COVID + 2022
    full_2021: "data/gold/log_returns.parquet"       # 9 assets, BVC-limited window

# ── Phase 4: covariance ablation ladder, rung 3 (EWMA) ──────────────────────
covariance_ewma:
  halflife_days: 63          # matches ml_features' volatility_long_window for repo consistency

# ── Phase 4: covariance ablation ladder, rung 4 (DCC-GARCH, Engle 2002) ─────
covariance_dcc_garch:
  garch_p: 1
  garch_q: 1
  dcc_a_init: 0.02           # short-run correlation shock persistence, starting guess
  dcc_b_init: 0.95           # long-run correlation persistence, starting guess
  rescale_factor: 100        # arch's own convention for MLE numerical stability; undone after fit

# ── Phase 4: HMM regime detection ───────────────────────────────────────────
regime:
  n_states: 2                # bull/bear MVP — see CLAUDE.md §12 for the 3-state trade-off
  features: ["MARKET_RETURN", "MARKET_VOL_SHORT", "AVG_PAIRWISE_CORR"]  # causal Phase 3 outputs
  covariance_type: "diag"    # fewer params than "full" given 252-2500 row training windows
  n_restarts: 5              # multi-start EM, keep highest log-likelihood (hmmlearn is seed-sensitive)
  random_state_base: 0
  min_regime_train_days: 252 # below this: neutral 50/50 posterior fallback, never raise
  bull_strategy: "max_sharpe"
  bear_strategy: "min_variance_lw"

phase4:
  results_path: "data/gold/phase4_results.json"
