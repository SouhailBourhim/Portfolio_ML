# Portfolio ML — Docker Compose services.
#
#   docker compose up api               # research API on http://localhost:8000
#   docker compose up dashboard         # Streamlit app on http://localhost:8501
#   docker compose run --rm test        # offline test suite, zero config
#   docker compose run --rm pipeline    # Bronze→Silver→Gold (requires .env with FRED_API_KEY)
#   docker compose up notebook          # Jupyter on http://localhost:8888 (token in logs)
#
# `api` and `dashboard` both need the DVC bundle present on the host: they read
# committed artifacts and neither one refits anything. `test` deliberately does
# NOT mount data — see the note on that service.
#
# data/ and mlruns/ are mounted from the host so pipeline outputs and MLflow
# runs persist across containers (and stay visible to DVC on the host).

services:
  # The research API. Read-only by construction: it serves committed artifacts,
  # never refits, and the bundle is mounted read-only so that is enforced by the
  # filesystem rather than by convention.
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    # WHAT THIS PROBE ACTUALLY COVERS — narrower than an earlier version of
    # this comment claimed, and the correction matters.
    #
    # `/health` can in principle answer 200 with
    # {"status": "degraded", "missing_artifacts": [...]}, and that is genuine
    # API behaviour. But it is UNREACHABLE AT STARTUP in this container: the
    # image's CMD runs `check_artifacts.py && exec uvicorn ...`, so an
    # incomplete bundle means uvicorn never binds and nothing answers on 8000
    # at all. The three files `/health` inspects are a strict subset of the
    # eight `check_artifacts.py` requires, so any container that binds has
    # already satisfied the stricter gate and reports "ok".
    #
    # The startup gate is kept as the primary defence — refusing to serve is
    # safer than serving a subset a caller could mistake for the whole. This
    # probe therefore does two narrower jobs: ordinary liveness, and catching
    # the bundle CHANGING underneath a running container (the mount is
    # read-only to the container, not to the host, so files can still vanish
    # from under a long-lived process). It asserts status == "ok" rather than
    # just the HTTP code so that second case is actually caught.
    #
    # Written in Python because `python:3.11-slim` ships neither curl nor wget,
    # and installing one only to health-check would grow the image for nothing.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          with urllib.request.urlopen("http://localhost:8000/health", timeout=3) as r:
              body = json.load(r)
          sys.exit(0 if body.get("status") == "ok" else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      # The startup gate reads and hashes the artifact bundle before uvicorn
      # binds, so the first probe must not fire into a container that is
      # legitimately still checking.
      start_period: 20s

  # The two-page Streamlit research app. It reads the SAME committed Gold
  # artifacts as the API rather than calling it — that shared data layer is why
  # the two surfaces cannot disagree about a number — so there is deliberately
  # no `depends_on: api` here. Read-only mount for the same reason the API has
  # one: neither surface writes.
  #
  # Same artifact preflight as the API, for the same reason. Without it
  # Streamlit binds and serves a page, and `dashboard/shared/data.py::_require`
  # only raises when a page RENDERS — so an incomplete or stale bundle reaches
  # a reader as an error page or, worse, a partially-populated one. Refusing to
  # start is the behaviour the API already has, and the two surfaces read the
  # same artifacts, so they should fail the same way.
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    command: >
      sh -c 'python scripts/check_artifacts.py &&
      exec streamlit run dashboard/streamlit_app.py
      --server.address=0.0.0.0 --server.port=8501'

  # No data mount, on purpose: the suite must pass on a fresh clone with no
  # bundle, which is what keeps it hermetic and lets CI run it on every push.
  #
  # The consequence is worth stating rather than discovering: the artifact
  # consistency, release-facts and model-integrity checks all SKIP without
  # `data/`, so a green run here has not verified them. Mount the bundle
  # read-only to exercise those too:
  #   docker compose run --rm -v "$PWD/data:/app/data:ro" test
  test:
    build: .
    command: python -m pytest tests/ -q

  pipeline:
    build: .
    env_file:
      - path: .env
        required: true   # FRED_API_KEY needed; get a free key at fred.stlouisfed.org
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    command: python src/pipeline.py

  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
